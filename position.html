
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>nutellas page!</title>
  <style>
    div {
    width: 300px;
    height: 300px;
    background: pink;
    margin: 50px;
  }
  #static{
    background-color: violet;
    position:static; /*default position*/
  }

  #sticky{
    background-color: lavender;
    position:sticky; /*static until hits edge*/
  }

  #relative{
    background-color: aquamarine;
    position:relative; /*moves box but leaves hole*/
    left: 100px;
    top: -100px;
    z-index: -10;

  }
  #fixed{
    background-color: rgb(242, 206, 253);
    position:fixed;
    top: 50px;
    right:50px;
  }
  #absolute{
    background-color: rgb(220, 217, 255);
    position:absolute; /*stuck to content, no hole*/
    right: 30px;
    bottom:50px;

  }
  



    </style>
  

<head>


<body>
  <div id="static"></div>
  <div id="sticky"></div>
  <div id="relative"></div>
  <div id="fixed"></div>
  <div id="absolute"></div>
</body>

</html>
